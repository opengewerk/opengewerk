name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  encoding:
    name: Kodierung und Zeilenenden
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Textdateien auf UTF-8 ohne BOM und LF prüfen
        run: |
          python3 - <<'PYTHON'
          import subprocess
          import sys

          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          raw = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              if content.startswith(b"\xef\xbb\xbf"):
                  problems.append(f"{path}: UTF-8 mit BOM")
              try:
                  content.decode("utf-8")
              except UnicodeDecodeError as error:
                  problems.append(f"{path}: kein gültiges UTF-8 ({error})")
                  continue
              if b"\r\n" in content:
                  problems.append(f"{path}: enthält CRLF-Zeilenenden")

          if problems:
              print("Gefundene Probleme:")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Alle Textdateien sind UTF-8 ohne BOM und benutzen LF.")
          PYTHON

  typography:
    name: Schreibweise
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Auf Gedankenstriche prüfen
        run: |
          python3 - <<'PYTHON'
          import subprocess
          import sys

          # Em dash and en dash are unwanted across the project, number ranges
          # included: those take a plain hyphen (25-75, Z1-Z3). The reason is
          # written down in the CLAUDE.md of the project folder.
          DASHES = {chr(0x2013): "Halbgeviertstrich", chr(0x2014): "Geviertstrich"}
          EXEMPT = {"LICENSE"}
          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          raw = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path in EXEMPT or path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), start=1):
                  for character, label in DASHES.items():
                      if character in line:
                          problems.append(f"{path}:{number}: {label} in: {line.strip()}")
                          break

          if problems:
              print("Gedankenstriche gefunden. Ersetze sie je nach Satzbau durch")
              print("Doppelpunkt, Komma, Semikolon oder Punkt, bei Zahlenbereichen")
              print("durch einen einfachen Bindestrich.")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Keine Gedankenstriche gefunden.")
          PYTHON

      - name: Auf umgeschriebene Umlaute prüfen
        run: |
          python3 - <<'PYTHON'
          import re
          import subprocess
          import sys

          # German text keeps its real characters, so "ae" where an "ä" belongs is a
          # mistake. The reason this needs a check rather than good intentions is the
          # same as for the dashes above: a file delivered from outside brings tidied up
          # places back, all at once, and a diff of a whole file hides it.
          #
          # The words are written correctly here and transliterated at startup. That is
          # not a detour, it is what keeps this job from tripping over its own word
          # list: this file holds the proper spelling, the search runs on the other one.
          #
          # A list rather than a pattern on "ae|oe|ue", because those pairs sit in a
          # great many English words (value, queue, issue, guest, true) and a pattern on
          # them reports almost nothing but noise.
          #
          # "ss" for "ß" is only in here where it is unambiguous. "dass", "muss" and
          # "Fluss" are correct, and a rule on "ss" could not tell those from "Straße".
          GERMAN_WORDS = (
              "hält häng häuf hätt änder ähnlich währ wähl träg absätz fäll läuft "
              "längst täglich nächst spät mäßig gemäß erklär zähl stärk schwäch bänd "
              "länd männ gefähr anhäng beschränk bösartig nötig möglich öffn veröffent "
              "lösch lösung stör höchst höher größ könn schön ström wört zöger ökonom "
              "führ für über übung üblich müss prüf gründ würde verfüg zurück dürf tür "
              "gültig günstig büro gebühr spüren fünf kürz lücke stück schlüssel "
              "unterstütz berücksicht natürlich gerüst draußen straße größe maßnahme "
              "schließ außer grün gefüll füllung"
          ).split()

          TRANSLITERATION = {"ä": "ae", "ö": "oe", "ü": "ue", "ß": "ss"}


          def transliterate(word):
              for character, replacement in TRANSLITERATION.items():
                  word = word.replace(character, replacement)
              return word


          STEMS = [transliterate(word) for word in GERMAN_WORDS]

          # Where ASCII is right and stays right, and where none of the rules below
          # already covers it. A list on purpose, so that a second entry is a decision in
          # a diff and not a line nobody looked at twice. A word in here is accepted
          # everywhere, this file included.
          ALLOWED = {
              # The id field of the issue templates, an identifier and not prose.
              "pruefung",
          }

          EXEMPT = {"LICENSE"}
          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          WORD = re.compile(r"[A-Za-zÄÖÜäöüß]+")
          # A chunk without whitespace that carries a path, a file name or an address.
          # None of that is prose and all of it is deliberately ASCII: a file is not
          # called "0008-plugin-system-für-gewerke.md", and the local part of a mail
          # address carries no umlaut.
          NOT_PROSE = re.compile(r"[/\\@]|\.[A-Za-z0-9]{1,5}\b")


          def offending_words(line):
              for chunk in line.split():
                  if NOT_PROSE.search(chunk):
                      continue
                  for match in WORD.finditer(chunk):
                      word = match.group(0)
                      lowered = word.lower()
                      if lowered in ALLOWED:
                          continue
                      # An abbreviation such as GAEB is spelled without an umlaut.
                      if word.isupper():
                          continue
                      if any(stem in lowered for stem in STEMS):
                          yield word


          raw = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path in EXEMPT or path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              for number, line in enumerate(text.splitlines(), start=1):
                  for word in offending_words(line):
                      problems.append(f"{path}:{number}: {word} in: {line.strip()}")
                      break

          if problems:
              print("Umgeschriebene Umlaute gefunden. In den Text gehören die echten")
              print("Zeichen: ä ö ü Ä Ö Ü ß. Ist ASCII an der Stelle richtig, weil das Wort")
              print("ein Bezeichner ist, gehört es in die Liste ALLOWED in diesem Job.")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Keine umgeschriebenen Umlaute gefunden.")
          PYTHON

  code:
    name: Typprüfung, Lint und Tests
    runs-on: ubuntu-latest

    # The tests of the data model run against a real PostgreSQL, not an
    # imitation: what they check are foreign keys, check constraints and
    # uuidv7(), and that is exactly the part an imitation does differently
    # from the real thing.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opengewerk
          POSTGRES_PASSWORD: opengewerk
          POSTGRES_DB: opengewerk_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opengewerk -d opengewerk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: pnpm über Corepack bereitstellen
        run: corepack enable

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Bauen
        run: pnpm run build

      - name: Typprüfung
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Formatierung
        run: pnpm run format:check

      - name: Tests
        run: pnpm run test
        env:
          DATABASE_URL: postgres://opengewerk:opengewerk@127.0.0.1:5433/opengewerk_test

      # ADR 0004 asks for a bundle budget per entry and names a number: under
      # 300 kB gzip on the first load on site. What is measured is what the
      # browser fetches before the application runs, taken from the built HTML
      # files and not from a list somebody would have to maintain.
      - name: Bündelbudget je Einstieg
        run: pnpm --filter @opengewerk/web run budget

  e-invoice:
    name: E-Rechnung gegen KoSIT und Mustang
    runs-on: ubuntu-latest

    # The application checks the schema itself, on every e-invoice before it
    # is stored. The business rules of EN 16931 and XRechnung are Schematron
    # and need XSLT 2, so Java; they run here, with the validator of the KoSIT,
    # against the sample invoices from
    # packages/server/src/documents/test-samples.ts.
    #
    # Mustang checks the ZUGFeRD PDF: PDF/A-3 through veraPDF, and the XML
    # inside against the rules of Factur-X. The samples for it are printed by
    # the real renderer, the same image as in docker/compose.yaml, because
    # whether a PDF passes as PDF/A-3 depends on what Chromium writes.
    #
    # Validator, configuration and Mustang are pinned to one version and
    # checked by SHA-256, so that a new state of the rules stays a deliberate
    # change.
    services:
      renderer:
        image: ghcr.io/browserless/chromium:v2.57.0@sha256:6bac628b3d8293f8fb251d3a6b63030dfc5a1cb0c7e5c39abe5efd8f4b25360b
        env:
          TOKEN: probe
        ports:
          - 3999:3000

    env:
      KOSIT_VALIDATOR: 1.6.3
      KOSIT_CONFIGURATION: 2026-08-31
      MUSTANG: 2.26.0
      SAMPLES: ${{ github.workspace }}/e-invoice-samples

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Renderer wie im Betrieb
        run: |
          python3 - <<'PYTHON'
          import re
          import sys

          # The samples are printed by the service above, and what they prove
          # only holds for the renderer an installation runs. Both name the
          # image by hand, so this is the check that they name the same one.
          def renderer(path, indent):
              text = open(path, encoding="utf-8").read()
              found = re.search(r"^" + indent + r"renderer:\n\s+image: (\S+)$", text, re.M)
              return found.group(1) if found else None

          workflow = renderer(".github/workflows/ci.yml", "      ")
          compose = renderer("docker/compose.yaml", "  ")

          if not workflow or workflow != compose:
              print("Der Renderer dieses Jobs ist nicht der aus docker/compose.yaml:")
              print(f"  ci.yml:       {workflow}")
              print(f"  compose.yaml: {compose}")
              sys.exit(1)

          print(f"Renderer wie im Betrieb: {compose}")
          PYTHON

      - name: pnpm über Corepack bereitstellen
        run: corepack enable

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Java einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Abhängigkeiten des Servers bauen
        run: pnpm --filter "@opengewerk/server^..." run build

      - name: Auf den Renderer warten
        run: |
          set -euo pipefail
          # The service container is started before the first step, not
          # necessarily ready by it.
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:3999/json/version?token=probe"; then
              exit 0
            fi
            sleep 2
          done
          echo "Der Renderer ist nach einer Minute nicht erreichbar."
          exit 1

      - name: Musterrechnungen schreiben
        run: >-
          pnpm --filter @opengewerk/server exec vitest run
          src/documents/cii.test.ts src/documents/zugferd.test.ts
        env:
          CII_SAMPLES_DIR: ${{ env.SAMPLES }}
          ZUGFERD_SAMPLES_DIR: ${{ env.SAMPLES }}/zugferd
          RENDERER_URL: http://127.0.0.1:3999
          RENDERER_TOKEN: probe

      - name: Validator, XRechnung-Konfiguration und Mustang holen
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o validator.jar \
            "https://github.com/itplr-kosit/validator/releases/download/v${KOSIT_VALIDATOR}/validator-${KOSIT_VALIDATOR}-standalone.jar"
          curl -fsSL -o configuration.zip \
            "https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v${KOSIT_CONFIGURATION}/xrechnung-3.0.2-validator-configuration-${KOSIT_CONFIGURATION}.zip"
          curl -fsSL -o mustang.jar \
            "https://github.com/ZUGFeRD/mustangproject/releases/download/core-${MUSTANG}/Mustang-CLI-${MUSTANG}.jar"
          sha256sum -c - <<'SUMS'
          799e64befca97d4080e03608c80b85dd5a5ecc5f4ae4f35d1116ec2855b9a7c9  validator.jar
          2530cd107c414511c5d0462ec10f886910395abfca820db82e83d70bf01221a8  configuration.zip
          42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736  mustang.jar
          SUMS
          unzip -q configuration.zip -d configuration

      - name: Musterrechnungen prüfen
        run: |
          set -euo pipefail
          count=$(find "$SAMPLES" -name '*.xml' | wc -l)
          if [ "$count" -lt 9 ]; then
            echo "Erwartet waren mindestens neun Musterrechnungen, gefunden: $count."
            exit 1
          fi
          java --enable-native-access=ALL-UNNAMED -jar "$RUNNER_TEMP/validator.jar" \
            -s "$RUNNER_TEMP/configuration/scenarios.xml" \
            -r "$RUNNER_TEMP/configuration" \
            -o "$RUNNER_TEMP/reports" \
            "$SAMPLES"/*.xml

      - name: ZUGFeRD-PDFs prüfen
        run: |
          set -euo pipefail
          count=$(find "$SAMPLES/zugferd" -name '*.pdf' | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "Erwartet waren mindestens fünf ZUGFeRD-PDFs, gefunden: $count."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/reports"
          for pdf in "$SAMPLES"/zugferd/*.pdf; do
            name=$(basename "$pdf" .pdf)
            report="$RUNNER_TEMP/reports/$name-mustang.xml"
            # Mustang ends with an error code on a rejection. The report is
            # read as well, so that a version which stops doing that does not
            # turn a rejection into a pass.
            if ! java -jar "$RUNNER_TEMP/mustang.jar" --action validate --source "$pdf" \
              --no-notices > "$report" || grep -q 'status="invalid"' "$report"; then
              echo "Mustang lehnt $name ab:"
              cat "$report"
              exit 1
            fi
            echo "$name: gültig als PDF/A-3 und als ZUGFeRD im Profil EN 16931"
          done

      - name: Berichte bei einem Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e-rechnung-berichte
          path: |
            ${{ runner.temp }}/reports
            ${{ env.SAMPLES }}
          if-no-files-found: ignore

  widths:
    name: Breiten und Auflösungen
    runs-on: ubuntu-latest

    # Every screen of both entries at the widths of the board "Breiten und
    # Auflösungen", from 320 to 3840 pixels, light and dark, and the job fails
    # as soon as a page is wider than its window (#218). The screens are found
    # by following the links of the preview, so a new one is checked without
    # anybody adding it here.
    #
    # The browser is the image of the renderer in docker/compose.yaml, on the
    # network of the runner: the preview listens on 127.0.0.1 and nowhere
    # else, and a service container would not reach it there.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opengewerk
          POSTGRES_PASSWORD: opengewerk
          POSTGRES_DB: opengewerk_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opengewerk -d opengewerk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Browser wie im Betrieb starten
        run: |
          set -euo pipefail
          image=$(sed -n '/^  renderer:$/{n;s/^ *image: //p;}' docker/compose.yaml)

          if [ -z "$image" ]; then
            echo "In docker/compose.yaml steht kein Abbild für den Renderer."
            exit 1
          fi

          echo "Browser: $image"
          docker run -d --rm --name browser --network host -e TOKEN=probe -e TIMEOUT=1800000 "$image"

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:3000/json/version?token=probe"; then
              exit 0
            fi
            sleep 2
          done

          echo "Der Browser ist nach einer Minute nicht erreichbar."
          exit 1

      - name: pnpm über Corepack bereitstellen
        run: corepack enable

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Vorschau starten
        run: |
          set -euo pipefail
          # Builds the interface, empties and migrates opengewerk_preview in
          # the database above and plants the sample business. The line below
          # is printed once all of it is there.
          nohup pnpm run preview > "$RUNNER_TEMP/preview.log" 2>&1 &

          for _ in $(seq 1 90); do
            if grep -q "Die Vorschau läuft unter" "$RUNNER_TEMP/preview.log"; then
              exit 0
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/preview.log"
          echo "Die Vorschau ist nach drei Minuten nicht gestartet."
          exit 1

      - name: Jede Seite bei jeder Breite
        run: pnpm --filter @opengewerk/web run widths
        env:
          WIDTHS_BROWSER: ws://127.0.0.1:3000?token=probe&timeout=1800000
          WIDTHS_ADDRESS: http://127.0.0.1:23700

      - name: Aufnahmen bei einem Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: widths-report
          path: |
            packages/web/widths-report
            ${{ runner.temp }}/preview.log
          if-no-files-found: ignore

  # The three runs on a whole stack call their steps from docker/test-stack.sh,
  # which belongs to the foundation and stands there with the reason for each
  # step (opengewerk-haustechnik#14). What they need to know about this
  # application beyond its compose.yaml and application.env is in
  # docker/test-material.sh. Another application runs the same steps against
  # its own folder; the names of the steps here are the ones its runs take.
  operations:
    name: Betrieb über Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Einrichtungsskript prüfen
        working-directory: docker
        run: sh test-setup.sh

      # Whether start.sh builds or pulls (#155), with a docker that only
      # writes down what it is asked. The pull itself needs a published
      # release; the step below starts from the source.
      - name: Startskript prüfen
        working-directory: docker
        run: sh test-start.sh

      # The names of the archives (opengewerk-haustechnik#14), with the backup
      # scripts and stand-ins for the tools of PostgreSQL: in a folder shared
      # with another application, each finds, keeps and removes only its own.
      - name: Namen der Sicherungen prüfen
        working-directory: docker
        run: sh test-backup.sh

      - name: Jeder Dienst begrenzt seine Protokolle
        working-directory: docker
        run: sh test-stack.sh log-limits

      - name: Stapel starten
        working-directory: docker
        run: sh test-stack.sh start

      - name: Die .env ist ausgefüllt und nur für ihren Besitzer lesbar
        working-directory: docker
        run: sh test-stack.sh env-file

      - name: Instanz antwortet mit migrierter Datenbank
        working-directory: docker
        run: sh test-stack.sh answers

      - name: Die Ersteinrichtung verlangt den Einrichtungscode
        working-directory: docker
        run: sh test-stack.sh first-run

      - name: Favicon und Icons beider Einstiege kommen als Bild
        working-directory: docker
        run: sh test-stack.sh icons

      # The renderer belongs to the default stack: COMPOSE_PROFILES in the
      # template switches it on. Asked from inside the application container,
      # through the same function the application prints with, the foundation's
      # since #23, so address and token come from its environment and never
      # appear in this log. Chromium takes a few seconds after the container is
      # up, hence the retries.
      - name: Der Renderer läuft von Haus aus und druckt ein PDF
        working-directory: docker
        run: |
          set -eu
          docker compose ps --status running --services | grep -qx renderer
          docker compose exec -T app node --input-type=module -e '
            const { readRendererConfiguration, rendererFor } = await import("@opengewerk/platform-server")
            const render = rendererFor(readRendererConfiguration())
            let pdf = null
            for (let attempt = 1; pdf === null; attempt++) {
              try {
                pdf = await render({ html: "<p>OpenGewerk</p>" })
              } catch (error) {
                if (attempt === 30) {
                  console.error(`Der Renderer hat nach 30 Versuchen kein PDF geliefert: ${error.message}`)
                  process.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 2000))
              }
            }
            const head = new TextDecoder().decode(pdf.subarray(0, 5))
            if (head !== "%PDF-") {
              console.error(`Der Renderer hat kein PDF geliefert, die Antwort beginnt mit: ${head}`)
              process.exit(1)
            }
            console.log(`PDF vom Renderer: ${pdf.byteLength} Bytes`)
          '

      - name: Speicherbedarf im Leerlauf melden
        working-directory: docker
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}'

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        working-directory: docker
        run: docker compose logs

      - name: Aufräumen
        if: always()
        working-directory: docker
        run: docker compose down --volumes

  backup:
    name: Sicherung und Rückspielen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Zugangsdaten und Schlüsselpaar erzeugen
        working-directory: docker
        run: |
          sh test-stack.sh setup
          sh test-stack.sh keys

      - name: Stapel starten
        working-directory: docker
        run: sh test-stack.sh up

      - name: Eine leere Instanz sichert der Zeitplan nicht
        working-directory: docker
        run: sh test-stack.sh skips-empty

      - name: Daten und Dateien anlegen
        working-directory: docker
        run: sh test-stack.sh seed

      - name: Stand vor der Sicherung festhalten
        working-directory: docker
        run: sh test-stack.sh snapshot

      - name: Sicherung erstellen
        working-directory: docker
        run: sh test-stack.sh backup

      - name: Die Anwendung liest, wann die Sicherung fertig wurde
        working-directory: docker
        run: sh test-stack.sh record

      - name: Datenplatte verlieren, Sicherung behalten
        working-directory: docker
        run: sh test-stack.sh lose-data

      - name: Sicherung zurückspielen
        working-directory: docker
        run: sh test-stack.sh restore

      - name: Derselbe Datenbestand, dieselbe Audit-Kette
        working-directory: docker
        run: sh test-stack.sh compare

      - name: Eine beschädigte Sicherung wird abgelehnt
        working-directory: docker
        run: sh test-stack.sh corrupt

      - name: Die nächtliche Sicherung holt nach
        working-directory: docker
        run: sh test-stack.sh catch-up

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        working-directory: docker
        run: docker compose logs

      - name: Aufräumen
        if: always()
        working-directory: docker
        run: docker compose --profile backup down --volumes --remove-orphans

  update:
    name: Update einer laufenden Instanz
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Zugangsdaten für den Lauf erzeugen
        working-directory: docker
        run: sh test-stack.sh setup

      - name: Auf den Stand einer älteren Fassung zurücknehmen
        working-directory: docker
        run: sh test-stack.sh rewind

      - name: Datenbank auf dem Stand der älteren Fassung
        working-directory: docker
        run: sh test-stack.sh older

      - name: Daten anlegen und den Stand festhalten
        working-directory: docker
        run: sh test-stack.sh seed-older

      - name: Aktualisieren, erst migrieren und dann tauschen
        working-directory: docker
        run: sh test-stack.sh update

      - name: Derselbe Bestand auf dem neuen Stand
        working-directory: docker
        run: sh test-stack.sh after-update

      - name: Eine fehlerhafte Migration bricht ab, die Instanz läuft weiter
        working-directory: docker
        run: sh test-stack.sh broken-update

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        working-directory: docker
        run: docker compose logs

      - name: Aufräumen
        if: always()
        working-directory: docker
        run: docker compose down --volumes --remove-orphans
