name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  encoding:
    name: Kodierung und Zeilenenden
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Textdateien auf UTF-8 ohne BOM und LF prüfen
        run: |
          python3 - <<'PYTHON'
          import subprocess
          import sys

          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          raw = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              if content.startswith(b"\xef\xbb\xbf"):
                  problems.append(f"{path}: UTF-8 mit BOM")
              try:
                  content.decode("utf-8")
              except UnicodeDecodeError as error:
                  problems.append(f"{path}: kein gültiges UTF-8 ({error})")
                  continue
              if b"\r\n" in content:
                  problems.append(f"{path}: enthält CRLF-Zeilenenden")

          if problems:
              print("Gefundene Probleme:")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Alle Textdateien sind UTF-8 ohne BOM und benutzen LF.")
          PYTHON

  typography:
    name: Schreibweise
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Auf Gedankenstriche prüfen
        run: |
          python3 - <<'PYTHON'
          import subprocess
          import sys

          # Em dash and en dash are unwanted across the project, number ranges
          # included: those take a plain hyphen (25-75, Z1-Z3). The reason is
          # written down in the CLAUDE.md of the project folder.
          DASHES = {chr(0x2013): "Halbgeviertstrich", chr(0x2014): "Geviertstrich"}
          EXEMPT = {"LICENSE"}
          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          raw = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path in EXEMPT or path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), start=1):
                  for character, label in DASHES.items():
                      if character in line:
                          problems.append(f"{path}:{number}: {label} in: {line.strip()}")
                          break

          if problems:
              print("Gedankenstriche gefunden. Ersetze sie je nach Satzbau durch")
              print("Doppelpunkt, Komma, Semikolon oder Punkt, bei Zahlenbereichen")
              print("durch einen einfachen Bindestrich.")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Keine Gedankenstriche gefunden.")
          PYTHON

  code:
    name: Typprüfung, Lint und Tests
    runs-on: ubuntu-latest

    # Die Tests des Datenmodells laufen gegen eine echte PostgreSQL, nicht
    # gegen eine Nachbildung: geprüft werden Fremdschlüssel, Check-Constraints
    # und uuidv7(), und genau das ist der Teil, den eine Nachbildung anders
    # macht als der Ernstfall.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opengewerk
          POSTGRES_PASSWORD: opengewerk
          POSTGRES_DB: opengewerk_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opengewerk -d opengewerk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: pnpm über Corepack bereitstellen
        run: corepack enable

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Bauen
        run: pnpm run build

      - name: Typprüfung
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test
        env:
          DATABASE_URL: postgres://opengewerk:opengewerk@127.0.0.1:5433/opengewerk_test

  betrieb:
    name: Betrieb über Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Zugangsdaten für den Lauf erzeugen
        working-directory: docker
        run: |
          # Hex and not base64: a "/" in a password splits the connection
          # string at the wrong place, and the failure that reaches the log is
          # a name lookup for a host nobody meant.
          cp .env.example .env
          for name in POSTGRES_PASSWORD OPENGEWERK_OWNER_PASSWORD OPENGEWERK_APP_PASSWORD RENDERER_TOKEN; do
            secret=$(openssl rand -hex 32)
            sed -i "s|^${name}=.*|${name}=${secret}|" .env
          done
          ! grep -q "bitte-ersetzen" .env

      - name: Stapel starten
        working-directory: docker
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Instanz antwortet mit migrierter Datenbank
        working-directory: docker
        run: |
          set -eu

          health=$(curl --silent --fail http://127.0.0.1:3000/health)
          echo "Health: ${health}"
          test "${health}" = '{"status":"bereit","database":true}'

          # Without authentication every route touching data has to refuse. An
          # instance answering 200 here would be handing out tenant data.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/customers)
          echo "GET /customers: ${status}"
          test "${status}" = "401"

          # The migration created the tables, and every one of them is under
          # row level security. One without it would be readable across
          # tenants, and this is the run where that has to show up.
          ungeschuetzt=$(docker compose exec -T postgres psql --username postgres --dbname opengewerk --tuples-only --no-align --command "select count(*) from pg_tables where schemaname = 'public' and not rowsecurity")
          echo "Tabellen ohne Row-Level Security: ${ungeschuetzt}"
          test "${ungeschuetzt}" = "0"

      - name: Speicherbedarf im Leerlauf melden
        working-directory: docker
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}'

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        working-directory: docker
        run: docker compose logs

      - name: Aufräumen
        if: always()
        working-directory: docker
        run: docker compose down --volumes
