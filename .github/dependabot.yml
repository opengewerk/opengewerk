version: 2
updates:
  # The images in docker/compose.yaml, the renderer above all. A pull request
  # that moves the renderer also has to move the renderer of the e-invoice job
  # in ci.yml; the step "Renderer wie im Betrieb" stays red until it does.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly

  # The actions in the workflows. Those from outside GitHub are pinned to a
  # commit in release.yml (#155); a pin that nobody moves keeps its version
  # forever, and Dependabot moves the commit and the comment with the version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
