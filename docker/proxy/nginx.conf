# Vorlage für nginx vor OpenGewerk: die Weiterleitung von HTTP auf HTTPS und
# der Reverse Proxy auf die Anwendung. Warum die Zeilen so sind, steht im README
# im Abschnitt "Reverse Proxy".
#
# So wird sie eingesetzt, etwa auf Debian oder Ubuntu:
#   1. Überall opengewerk.example.org durch den eigenen Namen ersetzen.
#   2. Das Zertifikat holen, solange die Standardseite auf Port 80 antwortet:
#        certbot certonly --webroot -w /var/www/html -d opengewerk.example.org
#   3. Die Datei als /etc/nginx/conf.d/opengewerk.conf ablegen, dann
#        nginx -t && systemctl reload nginx
#
# Security-Header setzt diese Datei bewusst keine: das tut die Anwendung
# selbst, ein zweites Mal wären sie falsch. Zwischengespeichert wird auch nichts.

# Die Anwendung lauscht nur auf 127.0.0.1. Der Port ist OPENGEWERK_PORT aus
# docker/.env; wer ihn dort geändert hat, ändert ihn hier.
upstream opengewerk {
    server 127.0.0.1:23700;
}

server {
    listen 80;
    listen [::]:80;
    # Der Name, unter dem die Instanz im Browser geöffnet wird.
    server_name opengewerk.example.org;

    # Beim Erneuern legt certbot hier seine Antwort ab; derselbe Ordner wie bei
    # -w oben.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Derselbe Name wie oben.
    server_name opengewerk.example.org;

    # Wo certbot das Zertifikat ablegt, mit dem eigenen Namen im Pfad.
    ssl_certificate     /etc/letsencrypt/live/opengewerk.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opengewerk.example.org/privkey.pem;

    # Host und Protokoll, wie der Browser sie sah, und X-Forwarded-For um die
    # Adresse des Clients ergänzt, nicht nur durchgereicht: danach zählen die
    # Grenzen je Adresse. Die Zeilen stehen nur hier. Bekommt ein location-Block
    # unten ein eigenes proxy_set_header, erbt er diese drei nicht mehr und
    # braucht sie dann alle selbst.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Ein Druck darf dauern: der Renderer bekommt für ein PDF bis zu 60
    # Sekunden, und nginx bräche ohne Angabe nach 60 Sekunden mit 504 ab.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Überall 2 MB, groß nur für Dateien und den Postausgang; die Grenze dort
    # setzt die Anwendung selbst, mit einem Satz dazu.
    client_max_body_size 2m;

    location / {
        proxy_pass http://opengewerk;
    }

    location /files/ {
        client_max_body_size 50m;
        proxy_pass http://opengewerk;
    }

    location = /sync {
        client_max_body_size 50m;
        proxy_pass http://opengewerk;
    }
}
