# Vorlage für Apache 2.4 vor OpenGewerk: die Weiterleitung von HTTP auf HTTPS
# und der Reverse Proxy auf die Anwendung. Warum die Zeilen so sind, steht im
# README im Abschnitt "Reverse Proxy".
#
# So wird sie eingesetzt, etwa auf Debian oder Ubuntu:
#   1. Überall opengewerk.example.org durch den eigenen Namen ersetzen.
#   2. Die Module einschalten:
#        a2enmod ssl proxy proxy_http headers rewrite
#   3. Das Zertifikat holen, solange die Standardseite auf Port 80 antwortet:
#        certbot certonly --webroot -w /var/www/html -d opengewerk.example.org
#   4. Die Datei als /etc/apache2/sites-available/opengewerk.conf ablegen, dann
#        a2ensite opengewerk && apache2ctl configtest && systemctl reload apache2
#
# Security-Header setzt diese Datei bewusst keine: das tut die Anwendung
# selbst, ein zweites Mal wären sie falsch. Setzt eine globale Vorgabe welche,
# etwa conf-enabled/security.conf, gehören sie dort für diesen Host heraus;
# ein "Header unset" hier nähme auch die der Anwendung weg. Zwischengespeichert
# wird nichts.

<VirtualHost *:80>
    # Der Name, unter dem die Instanz im Browser geöffnet wird.
    ServerName opengewerk.example.org

    # Beim Erneuern legt certbot hier seine Antwort ab; derselbe Ordner wie bei
    # -w oben. Alles andere geht auf HTTPS, mit dem eigenen Namen im Ziel.
    DocumentRoot /var/www/html
    RedirectMatch permanent "^/(?!\.well-known/acme-challenge/)(.*)$" "https://opengewerk.example.org/$1"
</VirtualHost>

<VirtualHost *:443>
    # Derselbe Name wie oben.
    ServerName opengewerk.example.org

    # Wo certbot das Zertifikat ablegt, mit dem eigenen Namen im Pfad.
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/opengewerk.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/opengewerk.example.org/privkey.pem

    # Die Anwendung lauscht nur auf 127.0.0.1. Der Port ist OPENGEWERK_PORT aus
    # docker/.env; wer ihn dort geändert hat, ändert ihn in beiden Zeilen.
    ProxyPass        / http://127.0.0.1:23700/
    ProxyPassReverse / http://127.0.0.1:23700/

    # Host und Protokoll, wie der Browser sie sah.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # X-Forwarded-For ergänzt mod_proxy um die Adresse des Clients, statt es nur
    # durchzureichen: danach zählen die Grenzen je Adresse. On ist die Vorgabe
    # und bleibt es.
    ProxyAddHeaders On

    # Ein Druck darf dauern: der Renderer bekommt für ein PDF bis zu 60
    # Sekunden, und ohne Angabe gälte Timeout, von Haus aus 60 Sekunden.
    ProxyTimeout 300

    # Überall 2 MB, groß nur für Dateien und den Postausgang; die Grenze dort
    # setzt die Anwendung selbst, mit einem Satz dazu. LimitRequestBody hilft
    # hier nicht: Apache wendet es auf eine Anfrage, die es weiterreicht, nicht
    # an. Geprüft wird deshalb die Länge, die eine Anfrage angibt. Eine ohne
    # Angabe der Länge geht weiter; für sie gelten die Grenzen der Anwendung.
    RewriteEngine On
    RewriteCond expr "%{HTTP:Content-Length} -gt 2097152 && ! %{REQUEST_URI} =~ m#^/(files/|sync$)#"
    RewriteRule ^ - [R=413,L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 52428800"
    RewriteRule ^ - [R=413,L]
</VirtualHost>
