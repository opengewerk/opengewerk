# The database for the tests, not for operation. Operation has its own file,
# compose.yaml next to this one, and it looks different: a volume belongs
# there, and deliberately none here, so that every run starts empty.
#
#   docker compose -f docker/compose.test.yaml up -d
#
# The name ends in _test, and the tests refuse to run against a database where
# it does not. These tests clean up before they start, and that is not to cost
# anybody their development data.

# A project name of its own, and that is not decoration. Without one, Compose
# names the project after the folder this file lies in, `docker`, as it does
# for every repository that keeps its files in a folder of that name. Two such
# files are then one project to Compose, and starting the other one replaces
# this container without a word. Seen on 01.10.2026 with the test database of
# OpenGewerk Haustechnik beside this one.
name: opengewerk-test

services:
  postgres:
    image: postgres:18-alpine
    container_name: opengewerk-test-db
    environment:
      POSTGRES_USER: opengewerk
      POSTGRES_PASSWORD: opengewerk
      POSTGRES_DB: opengewerk_test
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opengewerk -d opengewerk_test']
      interval: 2s
      timeout: 3s
      retries: 20
